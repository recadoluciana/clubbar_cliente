name: clubbar_cliente
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.1+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  qr_flutter: ^4.1.0
  cupertino_icons: ^1.0.8
  http: ^1.3.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.2
  url_launcher: ^6.3.1
  webview_flutter: ^4.8.0
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  app_links: ^6.4.0
  package_info_plus: ^9.0.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4


flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/images/icone_clubbar.png"

  adaptive_icon_background: "#FFFFFF"

  adaptive_icon_foreground:
    "assets/images/icone_clubbar.png"

  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
