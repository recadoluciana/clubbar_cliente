server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Permite que o popup do Google OAuth retorne ao Flutter Web.
    # O valor same-origin bloqueia a comunicação com a janela do Google.
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    }

    location = /flutter_bootstrap.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # O pacote principal precisa ser baixado a cada publicação. Sem isso,
    # alguns navegadores recebem um 304 e continuam executando a versão antiga.
    location = /main.dart.js {
        etag off;
        if_modified_since off;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /flutter_service_worker.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /manifest.json {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /icons/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /canvaskit/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
